<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Waxahachie, Texas Interactive Street Map</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html,body{
    margin:0;
    height:100%;
}

#map{
    width:100%;
    height:100%;
}

.leaflet-control-layers{
    font-size:15px;
}
</style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// Center of Waxahachie
var map = L.map('map',{
    center:[32.3865,-96.8483],
    zoom:13
});

// High-contrast streets WITHOUT labels
var streets = L.tileLayer(
'https://{s}.basemaps.cartocdn.com/rastertiles/voyager_nolabels/{z}/{x}/{y}{r}.png',
{
    attribution:'© OpenStreetMap © CARTO',
    maxZoom:20
}
).addTo(map);

// Labels only
var labels = L.tileLayer(
'https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png',
{
    attribution:'© OpenStreetMap © CARTO',
    pane:'overlayPane',
    maxZoom:20
}
).addTo(map);

// Toggle
L.control.layers(
{},
{
    "Street Names": labels
},
{
    collapsed:false
}).addTo(map);

</script>

</body>
</html>
