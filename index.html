<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Waxahachie, Texas Street Map</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html, body {
    margin: 0;
    height: 100%;
}

#map {
    width: 100%;
    height: 100%;
}
</style>

</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// Waxahachie, TX
var map = L.map('map', {
    center: [32.3865, -96.8483],
    zoom: 13
});

// Street layer without names
var streets = L.tileLayer(
'https://{s}.basemaps.cartocdn.com/rastertiles/voyager_nolabels/{z}/{x}/{y}{r}.png',
{
    maxZoom: 20,
    attribution:
    '&copy; OpenStreetMap &copy; CARTO'
}).addTo(map);


// Street name layer
var streetNames = L.tileLayer(
'https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png',
{
    maxZoom: 20,
    attribution:
    '&copy; OpenStreetMap &copy; CARTO'
}).addTo(map);


// Toggle control
var overlays = {
    "Street Names": streetNames
};

L.control.layers(null, overlays, {
    collapsed: false
}).addTo(map);


// Zoom control
L.control.scale().addTo(map);

</script>

</body>
</html>
